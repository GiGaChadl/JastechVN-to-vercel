services:
  db:
    image: postgres:16-alpine
    container_name: jastech-db
    environment:
      POSTGRES_USER: jastech
      POSTGRES_PASSWORD: jastech
      POSTGRES_DB: jastech
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U jastech']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
